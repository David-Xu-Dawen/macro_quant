# Render Blueprint：连接 GitHub 仓库后可用
# Dashboard → New → Blueprint → 选中本仓库
services:
  - type: web
    name: macro-quant
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      # AI 助手 / Agent 辩论依赖本机 Ollama，免费云端默认不可用
      - key: OLLAMA_HOST
        value: http://127.0.0.1:11434
